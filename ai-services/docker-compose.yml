services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ollama:/root/.ollama
    
    container_name: ollama
    tty: true
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
    ports:
      - 1111:8080
    environment:
      #- 'OLLAMA_BASE_URL=http://host.docker.internal:11434'
      - 'OLLAMA_BASE_URL=http://localhost:11434'
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    network_mode: bridge
    restart: unless-stopped

  docker-daemon:
    container_name: "ai-docker-daemon"
    environment:
      DOCKER_TLS_CERTDIR: ""
    image: "docker:dind"
    networks:
      "dind-network":
        aliases:
          - "docker"
    privileged: true
  ai-git-runner:
    image: ai-github-runner-linux:latest
    platform: linux/amd64
    #container_name: ai-git-runner
    build:
      context: ./git-runner
      dockerfile: Dockerfile
      args:
        RUNNER_VERSION: '2.324.0'
    env_file:
      - ./git-runner/.env
    depends_on:
      - "docker-daemon"
    environment:
      DOCKER_HOST: "tcp://docker:2375"
      DIND_USER_HOME: "/home/docker/actions-runner"
    volumes:
      - runner-data:/home/docker/actions-runner
    networks:
      "dind-network": {}

volumes:
  ollama: {}
  open-webui-data: {}
  runner-data: {}

networks:
  "dind-network":
    name: "dind-network"